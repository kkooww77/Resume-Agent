# Agent LLM 配置 - DeepSeek v4 Flash (DashScope 兼容模式)
# API key 从环境变量读取，请在 .env 文件中配置
# extra_body.enable_thinking=false：v4-flash 是推理模型，thinking 模式下
# 不支持 tool_choice=required（诊断/建议引擎依赖）；关闭思维链后支持，
# 且不产 reasoning token（更快），产品自有 thought 呈现体系不需要模型内置思维链
[llm]
# 2026-09-16 主对话切到 DeepSeek 官方 deepseek-flash。
# 沿革：阿里云百炼欠费(400 Arrearage) → 08-13 临时切中转站 ruoli.dev 的
# claude-sonnet-4-6 → 09-16 该模型被中转站下架(无可用渠道)，改用 DeepSeek 官方。
# ⚠️ deepseek-flash 默认开思考模式，会拒绝 tool_choice=required(诊断/建议引擎依赖)。
# 关它只认 extra_body 里的 thinking.type=disabled，
# DashScope 时代的 enable_thinking=false 在官方端被静默忽略，别照抄。
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key = "${DEEPSEEK_API_KEY}"
max_tokens = 8192
temperature = 0.3
api_type = "openai"
extra_body = { thinking = { type = "disabled" } }

# Vision model (如果需要)
[llm.vision]
model = "claude-sonnet-4-6"
base_url = "https://ruoli.dev/v1"
api_key = "${RUOLI_API_KEY}"
max_tokens = 8192
temperature = 0.3
api_type = "openai"

# 智谱模型配置 (混合增强策略)
# vision_model: glm-4.6v (视觉布局识别)
# ocr_model: glm-ocr (PDF 文档精确解析)
[zhipu]
api_key = "${ZHIPU_API_KEY}"
vision_model = "glm-4.6v"
ocr_model = "glm-ocr"

